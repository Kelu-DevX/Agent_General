# Sandbox for the Idaho tax analyst.
# Under `limited` networking, allowed_hosts also governs web_search / web_fetch,
# so these are the only sites the agent can search or read. Keep this list in
# sync with allowed_domains in ../agents/idaho-tax-analyst.md.
# A bare host matches only itself; "*.host" matches subdomains but not the bare host.
name: idaho-tax-analyst-env
config:
  type: cloud
  networking:
    type: limited
    allow_package_managers: true
    allow_mcp_servers: false
    allowed_hosts:
      - irs.gov
      - "*.irs.gov"
      - idaho.gov
      - "*.idaho.gov"
      - ssa.gov
      - "*.ssa.gov"
      - treasury.gov
      - "*.treasury.gov"
      - uscode.house.gov
      - ecfr.gov
      - "*.ecfr.gov"
      - federalregister.gov
      - "*.federalregister.gov"
      - govinfo.gov
      - "*.govinfo.gov"
      - law.cornell.edu
      - "*.law.cornell.edu"
      - congress.gov
      - "*.congress.gov"
      - healthcare.gov
      - "*.healthcare.gov"
      - cms.gov
      - "*.cms.gov"
      - yourhealthidaho.org
      - "*.yourhealthidaho.org"
      - sba.gov
      - "*.sba.gov"
      - dol.gov
      - "*.dol.gov"
